services:
  web:
    build: .
    image: ideationmax-web:latest
    container_name: ideationmax-web
    restart: unless-stopped
    # Bound to localhost only: the host's nginx terminates HTTPS and proxies here.
    # Change PORT if 8081 is already taken on the server.
    ports:
      - "127.0.0.1:${PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
