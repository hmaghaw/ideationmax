# IdeationMax — reverse proxy to the ideationmax-web container.
# Starts as HTTP only. `certbot --nginx` then adds the HTTPS listener,
# certificate paths and the HTTP -> HTTPS redirect to this same file.

upstream ideationmax_web {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name ideationmax.com www.ideationmax.com;

    access_log /var/log/nginx/ideationmax.access.log;
    error_log  /var/log/nginx/ideationmax.error.log;

    client_max_body_size 1m;

    location / {
        proxy_pass http://ideationmax_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
